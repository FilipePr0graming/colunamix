name: Build & Release (Windows)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - created
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to attach the .exe to, for example v1.8.17
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build app (electron-builder)
        working-directory: app
        run: npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ColunaMix-windows
          path: |
            app/release/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
          body_path: RELEASE-NOTES.md
          files: |
            app/release/*.exe
